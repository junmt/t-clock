name: Release

# GitHub 上で Release を公開 (Publish release) すると起動し、
# 単一 exe・zip・インストーラーをビルドしてその Release に添付する。
# タグ名は v で始める (例: v0.1.0, v1.2.3)。
on:
  release:
    types: [published]

permissions:
  contents: write   # Release へのアセット添付に必要

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # タグ v1.2.3 -> バージョン 1.2.3 を取り出す
      - name: Resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore TClock.sln

      - name: Test
        run: dotnet test TClock.Tests/TClock.Tests.csproj -c Release --no-restore

      # .NET ランタイム同梱の自己完結型・単一 exe を生成する
      - name: Publish (self-contained single-file, win-x64)
        run: >
          dotnet publish TClock.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $zip = "t-clock-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/t-clock.exe -DestinationPath $zip
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Inno Setup でインストーラーを作成する (ランナーに無ければ choco で導入)
      - name: Build installer (Inno Setup)
        id: setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
                  "/DSourceExe=$PWD\publish\t-clock.exe" `
                  installer\t-clock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "installer/Output/t-clock-${{ steps.ver.outputs.version }}-setup.exe"
          "installer=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release upload $env:TAG
          publish/t-clock.exe
          ${{ steps.pack.outputs.zip }}
          ${{ steps.setup.outputs.installer }}
          --clobber
          --repo ${{ github.repository }}
